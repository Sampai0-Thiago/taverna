# Sobe API + frontend com um comando:  docker compose up --build
# O banco fica no TiDB Cloud (DATABASE_URL no .env).
# Acesse http://localhost:8080
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (TiDB Cloud) no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-com-32+caracteres}
      CORS_ORIGIN: http://localhost:8080
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 15
      INVITE_CODE: ${INVITE_CODE:-}
      MASTER_TOKEN: ${MASTER_TOKEN:?defina MASTER_TOKEN no arquivo .env}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no arquivo .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TZ: America/Sao_Paulo
    volumes:
      - uploads:/app/uploads # imagens e PDFs persistem entre deploys

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  uploads:
